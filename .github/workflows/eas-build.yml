name: EAS Build (Android)

# Dispara un build en la nube de EAS (Expo) SOLO manualmente, desde la
# pestaña "Actions" de GitHub ("Run workflow"). El build en sí corre en
# los servidores de Expo, no en este runner de GitHub — este workflow
# solo lo pide y espera el resultado.
#
# A propósito NO se dispara en cada push: la cuenta free de EAS tiene
# cuota mensual limitada de builds Android, y la mayoría de los cambios
# de este proyecto son JS puro (se prueban con hot-reload vía
# `expo start --dev-client`, sin gastar build). Lanza uno manual solo
# cuando de verdad haga falta un APK nuevo (ej. se agregó una
# dependencia nativa).
on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Perfil de EAS a usar (preview, development, production)'
        required: false
        default: 'preview'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configurar EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Instalar dependencias
        run: npm ci

      - name: Lanzar build en EAS
        run: eas build --platform android --profile ${{ github.event.inputs.profile || 'preview' }} --non-interactive
